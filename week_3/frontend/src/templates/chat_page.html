<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Helper Chatbot</title>
    <style>
        /* CSS: Structural and Presentational Rules */
		body {
			font-family: system-ui, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			background-color: #f4f4f9;
		}

		.chat-container {
            width: 50vw;
			min-width: 380px;
			height: 600px;
			display: flex;
			flex-direction: column;
			background: #ffffff;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
			overflow: hidden;
		}

		.chat-header {
			background: #2563eb;
			color: #ffffff;
			padding: 16px;
			text-align: center;
			font-weight: 600;
			font-size: 1.1rem;
			border-bottom: 1px solid #1d4ed8;
		}

		.chat-messages {
			flex: 1;
			padding: 16px;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.message {
			max-width: 75%;
			padding: 12px 16px;
			border-radius: 16px;
			font-size: 0.95rem;
			line-height: 1.5;
			word-wrap: break-word;
		}

		.user-message {
			align-self: flex-end;
			background: #2563eb;
			color: #ffffff;
			border-bottom-right-radius: 4px;
		}

		.bot-message {
			align-self: flex-start;
			background: #f1f5f9;
			color: #1e293b;
			border-bottom-left-radius: 4px;
		}

		.chat-input-container {
			display: flex;
			padding: 16px;
			border-top: 1px solid #e2e8f0;
			background: #ffffff;
		}

		.chat-input {
			flex: 1;
			padding: 12px;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			outline: none;
			font-size: 0.95rem;
			transition: border-color 0.2s;
		}

		.chat-input:focus {
			border-color: #2563eb;
		}

		.send-btn {
			margin-left: 12px;
			padding: 0 20px;
			background: #2563eb;
			color: #ffffff;
			border: none;
			border-radius: 8px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s;
		}

		.send-btn:hover {
			background: #1d4ed8;
		}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Resume Chatbot
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message bot-message">Let's get started!</div>
    </div>

    <div class="chat-input-container">
        <input type="text" id="chat-input" class="chat-input" placeholder="Ask anything..." autocomplete="off">
        <button id="send-btn" class="send-btn">Send</button>
    </div>
</div>

</body>
</html>


<script>
	// JavaScript: Behavioral Logic and DOM Manipulation
	const messagesContainer = document.getElementById('chat-messages');
	const inputField = document.getElementById('chat-input');
	const sendButton = document.getElementById('send-btn');

	/**
	 * Appends a message element to the chat container.
	 * @param {string} text - The message content.
	 * @param {string} sender - The entity sending the message ('user' or 'bot').
	 */
	function appendMessage(text, sender) {
		const messageDiv = document.createElement('div');
		messageDiv.classList.add('message');
		messageDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
		messageDiv.textContent = text;

		messagesContainer.appendChild(messageDiv);

		// Force scroll to the bottom to track new messages
		messagesContainer.scrollTop = messagesContainer.scrollHeight;
	}

	/**
	 * Processes user input and triggers the simulated bot response.
	 */
	function handleSend() {
		const text = inputField.value.trim();
		if (!text) return; // Halt execution if input is empty

		// Register user message
		appendMessage(text, 'user');
		inputField.value = '';

		// Simulated asynchronous bot response loop
		setTimeout(() => {
			const responseText = "Acknowledged: You stated '" + text + "'. I am a localized interface with no external backend connection.";
			appendMessage(responseText, 'bot');
		}, 0);
	}

	// Event Listeners for trigger conditions
	sendButton.addEventListener('click', handleSend);

	inputField.addEventListener('keypress', (event) => {
		if (event.key === 'Enter') {
			event.preventDefault(); // Prevent default form submission behavior if wrapped in a form
			handleSend();
		}
	});
</script>
