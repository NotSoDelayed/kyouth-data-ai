services:
  frontend:
    build: ./frontend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/src:/app/src
    command: uv run uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
